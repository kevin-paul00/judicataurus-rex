<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Judicataurus Rex{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Judicataurus Rex</a>
    <span class="tagline">Judikatur zu Rechtsnormen aus dem RIS</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ attribution }}</p>
    <p>Rechtlich verbindlich ist nur der Inhalt des RIS selbst. Anfragen an das RIS sind auf eine alle {{ interval|round(1) }} s begrenzt.</p>
  </footer>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
